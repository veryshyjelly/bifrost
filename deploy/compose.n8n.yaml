# Add to compose.yaml when creating a new n8n instance for this bridge.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.0
    restart: unless-stopped
    env_file:
      - path: ./n8n.env
        format: raw
    ports:
      - '127.0.0.1:${N8N_HTTP_PORT:-5678}:5678'
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [n8n]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  n8n-data:

networks:
  n8n:
    external: false
    name: ${COMPOSE_PROJECT_NAME:-whatsapp-telegram-bridge}_n8n
