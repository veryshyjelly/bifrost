# Handwritten query contracts live in internal/postgres/queries; generated Go
# belongs in internal/postgres/db. Validate regeneration with make generate-check.
version: '2'
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/postgres/queries
    gen:
      go:
        package: db
        out: internal/postgres/db
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
